name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.302' }
      - run: dotnet build src/FleetOps.Api/FleetOps.Api.csproj --configuration Release
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: dotnet build FleetOps.slnx --configuration Release
      - working-directory: web
        run: npm ci && npm run build
      - name: Driver offline queue and storage boundary tests
        working-directory: web
        run: node --test --test-isolation=none scripts/driver-command-queue.test.mjs scripts/driver-storage-boundary.test.mjs
      - name: Validate vercel.json routes with the Vercel parser
        working-directory: web
        run: npm install --no-save @vercel/routing-utils@6.6.1 && node scripts/check-vercel-routes.mjs

  tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.302' }
      - run: dotnet test FleetOps.slnx --configuration Release

  test-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Fail on tests that cannot fail
        run: node scripts/check-test-integrity.mjs

  architecture:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.302' }
      - run: dotnet test tests/Architecture.Tests/Architecture.Tests.csproj --configuration Release

  client-staleness:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.302' }
      - run: dotnet build src/FleetOps.Api/FleetOps.Api.csproj --configuration Release
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json }
      - working-directory: web
        run: npm ci && npm run check:client

  migration-dry-run:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.302' }
      - run: dotnet tool install --global dotnet-ef --version 10.0.14
      - run: dotnet restore src/FleetOps.Migrations/FleetOps.Migrations.csproj
      - run: dotnet ef migrations script --idempotent --project src/FleetOps.Migrations/FleetOps.Migrations.csproj --startup-project src/FleetOps.Migrations/FleetOps.Migrations.csproj --output migration.sql
      - run: dotnet ef migrations has-pending-model-changes --project src/FleetOps.Migrations/FleetOps.Migrations.csproj --startup-project src/FleetOps.Migrations/FleetOps.Migrations.csproj
      - name: Fail if the migration script is empty
        run: grep -q 'migration_marker' migration.sql

  dependency-audit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.302' }
      - run: dotnet restore FleetOps.slnx
      - name: Fail on vulnerable NuGet packages
        run: |
          dotnet list FleetOps.slnx package --vulnerable --include-transitive | tee nuget-audit.txt
          ! grep -q 'has the following vulnerable packages' nuget-audit.txt
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - working-directory: web
        run: npm ci && npm audit --audit-level=high

  accessibility:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json }
      - working-directory: web
        run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, tests, architecture, client-staleness, migration-dry-run, dependency-audit, accessibility, test-integrity]
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.302' }
      - run: dotnet tool install --global dotnet-ef --version 10.0.14
      - run: dotnet restore src/FleetOps.Migrations/FleetOps.Migrations.csproj
      - run: ./deploy/db/migrate.ps1
        shell: pwsh
        env: { FLEETOPS_DATABASE_MIGRATION_URL: '${{ secrets.FLEETOPS_DATABASE_MIGRATION_URL }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: npm ci --prefix web
      - run: ./deploy/deploy.ps1
        shell: pwsh
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
